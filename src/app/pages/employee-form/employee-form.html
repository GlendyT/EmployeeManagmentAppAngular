<div class="container mt-4 mb-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Employee Form</h4>
        </div>
        <div class="card-body">

            <!-- Section: Personal Information -->
            <h5 class="text-secondary border-bottom pb-2 mb-3 mt-2">Personal Information</h5>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" [disabled]="loggedEmpData.role !== 'HR' " class="form-control"
                        [(ngModel)]="newEmployeeObj.name" id="name" placeholder="Enter full name">
                </div>

            </div>

            <!-- Section: Contact Details -->
            <h5 class="text-secondary border-bottom pb-2 mb-3 mt-4">Contact Details</h5>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" [(ngModel)]="newEmployeeObj.email" id="email"
                        placeholder="name@example.com">
                </div>
                <div class="col-md-4">
                    <label for="contactNo" class="form-label">Contact Number</label>
                    <input type="tel" class="form-control" [(ngModel)]="newEmployeeObj.contactNo" id="contactNo"
                        minlength="10" placeholder="Enter contact number">
                </div>
                <div class="col-md-4">
                    <label for="altContactNo" class="form-label">Alternate Contact No.</label>
                    <input type="tel" class="form-control" [(ngModel)]="newEmployeeObj.altContactNo" id="altContactNo"
                        placeholder="Optional">
                </div>
            </div>

            <!-- Section: Address Information -->
            <h5 class="text-secondary border-bottom pb-2 mb-3 mt-4">Address Information</h5>
            <div class="row mb-3">
                <div class="col-12 mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" [(ngModel)]="newEmployeeObj.address" id="address" rows="2"
                        placeholder="1234 Main St" [disabled]="loggedEmpData.role !== 'HR' "></textarea>
                </div>
                <div class="col-md-4">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" [(ngModel)]="newEmployeeObj.city" id="city"
                        placeholder="City" [disabled]="loggedEmpData.role !== 'HR' ">
                </div>
                <div class="col-md-4">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" [(ngModel)]="newEmployeeObj.state" id="state"
                        placeholder="State" [disabled]="loggedEmpData.role !== 'HR' ">
                </div>
                <div class="col-md-4">
                    <label for="pincode" class="form-label">Pincode</label>
                    <input type="text" class="form-control" [(ngModel)]="newEmployeeObj.pincode" id="pincode"
                        placeholder="Zip / Pincode" [disabled]="loggedEmpData.role !== 'HR' ">
                </div>
            </div>

            <!-- Section: Job Details -->
            <h5 class="text-secondary border-bottom pb-2 mb-3 mt-4">Job Details</h5>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="designationId" class="form-label">Designation</label>
                    <select class="form-select" id="designationId" [(ngModel)]="newEmployeeObj.designationId"
                        [disabled]="loggedEmpData.role !== 'HR' ">
                        <option selected disabled>Select Designation...</option>
                        @for (item of $designationList | async; track $index){
                        <option [value]="item.designationId">{{item.designationName}} - {{item.departmentName}}
                        </option>
                        }
                    </select>
                </div>
            </div>

            <div class="col-md-6">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" [(ngModel)]="newEmployeeObj.role"
                    [disabled]="loggedEmpData.role !== 'HR' ">
                    <option selected disabled>Select a role...</option>
                    @for (item of $designationList | async ; track $index) {
                    <option [value]="item.departmentName">{{item.departmentName}} </option>
                    }


                </select>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-end mt-4">
                <button type="button" class="btn btn-secondary me-2">Reset</button>
                @if (newEmployeeObj.employeeId == 0) {
                <button type="button" class="btn btn-primary" (click)="onSaveEmp()">Save Employee</button>
                } @else {
                <button type="button" class="btn btn-primary" (click)="onSaveEmp()">Update Employee</button>
                }


            </div>

        </div>
    </div>
</div>
